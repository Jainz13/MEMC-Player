name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEMC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "MEMC_KEYSTORE_FILE=keystore/release.jks" >> "$GITHUB_ENV"
            echo "Release signing key restored."
          else
            echo "::warning::No MEMC_KEYSTORE_BASE64 secret - APK will be debug-signed and cannot update over a previous install."
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          MEMC_KEYSTORE_PASSWORD: ${{ secrets.MEMC_KEYSTORE_PASSWORD }}
          MEMC_KEY_ALIAS: ${{ secrets.MEMC_KEY_ALIAS }}
          MEMC_KEY_PASSWORD: ${{ secrets.MEMC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Name APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/MEMC-Player-0.1.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: MEMC-Player-apk
          path: out/*.apk

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MEMC Player 0.1.${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}.
            On your phone: tap the APK below to download, then open it to install.
          files: out/*.apk
          make_latest: true
